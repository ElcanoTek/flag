name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks (make check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same shellcheck release contributors run (check_product_tools.sh
      # pins it): the runner's packaged one is older and reports a different
      # set of findings, so local and CI results would disagree.
      - name: Install shellcheck 0.11.0 (sha256-verified)
        run: |
          set -eu
          f=shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$f"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      # One entry point, the same one contributors run locally. sh, perl and
      # python3 come with the runner; shellcheck is installed above.
      #   vendorable  tokens/fonts/theme/icons/logos are safe to copy verbatim
      #   email       email-safe.html size limits; preview copy in sync
      #   tokens      design-tokens.json == design-tokens.css; contrast pairs
      #   refs        Markdown links, preview refs, sprite/logo/font coverage
      #   license     design-system/LICENSE matches the root MIT text
      #   tools       tools/product scripts: shellcheck, versions, standard-block hash
      - name: make check
        run: make check
