<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Template Preview — Elcano Design System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --toolbar-bg: #241B31;
      --toolbar-border: #3a2f4d;
      --toolbar-text: #FAFAFA;
      --toolbar-muted: #BEB6CD;
      --accent: #9DA7EF;
      --accent-hover: rgba(157, 167, 239, 0.1);
      --accent-border: rgba(157, 167, 239, 0.25);
      --btn-border: #3a2f4d;
      --btn-active-bg: #7272AB;
      --stage-bg-light: #F4F6FB;
      --stage-bg-dark: #121212;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1A0B1E;
      color: #D2D9DE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 24px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
    }

    .toolbar__left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .toolbar__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .toolbar__back:hover {
      background: var(--accent-hover);
      border-color: var(--accent-border);
    }

    .toolbar__title {
      font-size: 14px;
      font-weight: 700;
      color: var(--toolbar-text);
    }

    .toolbar__subtitle {
      font-size: 12px;
      color: var(--toolbar-muted);
      margin-top: 1px;
    }

    .toolbar__right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toolbar__group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border: 1px solid var(--btn-border);
    }

    .toolbar__group-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--toolbar-muted);
      padding: 0 8px 0 6px;
    }

    .seg-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--toolbar-muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .seg-btn:hover {
      background: rgba(157, 167, 239, 0.08);
      color: #D2D9DE;
    }

    .seg-btn.active {
      background: var(--btn-active-bg);
      color: #FAFAFA;
      border-color: var(--btn-active-bg);
    }

    .seg-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--toolbar-muted);
      background: transparent;
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.15s;
      margin-left: 4px;
    }

    .source-link:hover {
      background: rgba(157, 167, 239, 0.08);
      color: #D2D9DE;
    }

    /* ── Mode indicator ── */
    .mode-note {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 6px 0 0 0;
      transition: color 0.3s;
    }

    .mode-note[data-mode="light"] { color: #586F7C; }
    .mode-note[data-mode="dark"]  { color: #BEB6CD; }

    /* ── Stage ── */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 24px 28px;
      transition: background 0.3s ease;
    }

    .stage[data-bg="light"] {
      background: var(--stage-bg-light);
    }

    .stage[data-bg="dark"] {
      background: var(--stage-bg-dark);
    }

    .frame-wrap {
      width: 100%;
      max-width: 700px;
      transition: max-width 0.3s ease;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      margin-top: 8px;
    }

    .frame-wrap[data-vp="mobile"]  { max-width: 375px; }
    .frame-wrap[data-vp="email"]   { max-width: 700px; }
    .frame-wrap[data-vp="desktop"] { max-width: 100%; }

    .frame {
      width: 100%;
      height: calc(100vh - 100px);
      border: none;
      background: #FFFFFF;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .toolbar { padding: 10px 14px; gap: 8px; }
      .toolbar__group-label { display: none; }
      .stage { padding: 16px 10px; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar__left">
      <a class="toolbar__back" href="./index.html">&#8592; Design System</a>
      <div>
        <div class="toolbar__title">Email Template Preview</div>
        <div class="toolbar__subtitle">Rendered view of email-safe.html</div>
      </div>
    </div>
    <div class="toolbar__right">
      <!-- Theme toggle -->
      <div class="toolbar__group">
        <span class="toolbar__group-label">Inbox</span>
        <button class="seg-btn active" data-bg="light" title="Light inbox — how the email renders in a light-mode email client">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Light Inbox
        </button>
        <button class="seg-btn" data-bg="dark" title="Dark inbox — simulates how Outlook/Gmail dark mode forcibly inverts email backgrounds">
          <svg viewBox="0 0 16 16"><path d="M13.36 10.06A5.5 5.5 0 015.94 2.64a6.5 6.5 0 107.42 7.42z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Dark Inbox
        </button>
      </div>
      <!-- Viewport toggle -->
      <div class="toolbar__group">
        <span class="toolbar__group-label">Size</span>
        <button class="seg-btn" data-vp="mobile" title="Mobile 375px">
          <svg viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="6.5" y1="12.5" x2="9.5" y2="12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Mobile
        </button>
        <button class="seg-btn active" data-vp="email" title="Email 700px">
          <svg viewBox="0 0 16 16"><rect x="1" y="3" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1 4.5l7 4.5 7-4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          Email
        </button>
        <button class="seg-btn" data-vp="desktop" title="Full width">
          <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="6" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><line x1="8" y1="12" x2="8" y2="14" stroke="currentColor" stroke-width="1.3"/></svg>
          Desktop
        </button>
      </div>
      <a class="source-link" href="https://github.com/ElcanoTek/flag/blob/main/design-system/email-safe.html" target="_blank" rel="noreferrer">Source &#8599;</a>
    </div>
  </div>

  <div class="stage" id="stage" data-bg="light">
    <div class="mode-note" id="modeNote" data-mode="light">Light inbox preview — original email colors</div>
    <div class="frame-wrap" id="frameWrap" data-vp="email">
      <iframe class="frame" id="emailFrame" src="./email-safe.html" title="Email template rendered preview"></iframe>
    </div>
  </div>

  <script>
    (function () {
      var stage    = document.getElementById('stage');
      var wrap     = document.getElementById('frameWrap');
      var frame    = document.getElementById('emailFrame');
      var modeNote = document.getElementById('modeNote');

      /*
       * Dark-mode color map.
       *
       * Real email clients (Outlook dark, Gmail dark, Apple Mail dark) forcibly
       * invert light backgrounds to dark and dark text to light. They do NOT
       * touch the branded dark header (it's already dark). This map simulates
       * that behavior by swapping every inline background-color and color that
       * a dark-mode client would invert.
       *
       * Format: { originalColor: darkModeReplacement }
       */
      var bgMap = {
        /* Outer wrapper / body bg */
        '#f4f6fb': '#1e1e2e',
        'rgb(244, 246, 251)': '#1e1e2e',
        /* Main email card bg */
        '#fafafa': '#2a2a3c',
        'rgb(250, 250, 250)': '#2a2a3c',
        /* Status bar / metrics card bg */
        '#eef3ff': '#252538',
        'rgb(238, 243, 255)': '#252538',
        /* Risk callout bg */
        '#fff7e8': '#2e2518',
        'rgb(255, 247, 232)': '#2e2518',
        /* Opportunity callout bg */
        '#effaf3': '#1a2e20',
        'rgb(239, 250, 243)': '#1a2e20',
        /* Alternating table row */
        '#ffffff': '#2a2a3c',
        'rgb(255, 255, 255)': '#2a2a3c',
      };

      var textMap = {
        /* Primary body text */
        '#141824': '#e0e0e0',
        'rgb(20, 24, 36)': '#e0e0e0',
        /* Secondary text */
        '#33415f': '#c0c8d8',
        'rgb(51, 65, 95)': '#c0c8d8',
        /* Muted / caption text */
        '#586f7c': '#9aa8b4',
        'rgb(88, 111, 124)': '#9aa8b4',
        '#5c6a87': '#9aa8b4',
        'rgb(92, 106, 135)': '#9aa8b4',
        /* Risk callout heading */
        '#8f5a12': '#f0a040',
        'rgb(143, 90, 18)': '#f0a040',
        /* Opportunity callout heading */
        '#1c5a33': '#60d88a',
        'rgb(28, 90, 51)': '#60d88a',
      };

      var borderMap = {
        '#d7deee': '#3a3a50',
        'rgb(215, 222, 238)': '#3a3a50',
        '#e6ebf5': '#3a3a50',
        'rgb(230, 235, 245)': '#3a3a50',
        '#f0d7af': '#5a4520',
        'rgb(240, 215, 175)': '#5a4520',
        '#cdedd8': '#2a5035',
        'rgb(205, 237, 216)': '#2a5035',
      };

      /* Store original inline styles so we can restore on light mode */
      var originals = [];
      var darkApplied = false;

      function collectElements(doc) {
        return doc.querySelectorAll('body, body *');
      }

      function normalizeColor(c) {
        if (!c) return '';
        return c.toLowerCase().replace(/\s/g, '');
      }

      function applyDarkMode() {
        try {
          var doc = frame.contentDocument || frame.contentWindow.document;
          var els = collectElements(doc);
          originals = [];

          els.forEach(function (el) {
            var orig = {
              el: el,
              backgroundColor: el.style.backgroundColor || '',
              color: el.style.color || '',
              borderColor: el.style.borderColor || '',
              borderTopColor: el.style.borderTopColor || '',
              borderBottomColor: el.style.borderBottomColor || '',
              borderLeftColor: el.style.borderLeftColor || '',
              borderRightColor: el.style.borderRightColor || '',
            };
            originals.push(orig);

            /* Swap backgrounds */
            var bg = normalizeColor(el.style.backgroundColor);
            if (bg && bgMap[bg]) {
              el.style.backgroundColor = bgMap[bg];
            }

            /* Swap text colors */
            var col = normalizeColor(el.style.color);
            if (col && textMap[col]) {
              el.style.color = textMap[col];
            }

            /* Swap borders */
            var props = ['borderColor', 'borderTopColor', 'borderBottomColor', 'borderLeftColor', 'borderRightColor'];
            props.forEach(function (prop) {
              var val = normalizeColor(el.style[prop]);
              if (val && borderMap[val]) {
                el.style[prop] = borderMap[val];
              }
            });
          });

          darkApplied = true;
        } catch (e) {
          /* cross-origin: can't access iframe */
        }
      }

      function restoreLightMode() {
        if (!originals.length) return;
        originals.forEach(function (o) {
          o.el.style.backgroundColor = o.backgroundColor;
          o.el.style.color = o.color;
          o.el.style.borderColor = o.borderColor;
          o.el.style.borderTopColor = o.borderTopColor;
          o.el.style.borderBottomColor = o.borderBottomColor;
          o.el.style.borderLeftColor = o.borderLeftColor;
          o.el.style.borderRightColor = o.borderRightColor;
        });
        originals = [];
        darkApplied = false;
      }

      /* ── Background (light / dark) toggle ── */
      var bgBtns = document.querySelectorAll('.seg-btn[data-bg]');
      bgBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          bgBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          var mode = btn.getAttribute('data-bg');
          stage.setAttribute('data-bg', mode);
          modeNote.setAttribute('data-mode', mode);

          if (mode === 'dark') {
            modeNote.textContent = 'Dark inbox preview — simulates forced color inversion (Outlook / Gmail dark mode)';
            applyDarkMode();
          } else {
            modeNote.textContent = 'Light inbox preview — original email colors';
            restoreLightMode();
          }
        });
      });

      /* Re-apply dark mode after iframe reloads (e.g. if navigated) */
      frame.addEventListener('load', function () {
        if (stage.getAttribute('data-bg') === 'dark') {
          /* Small delay to ensure DOM is ready */
          setTimeout(applyDarkMode, 100);
        }
      });

      /* ── Viewport size toggle ── */
      var vpBtns = document.querySelectorAll('.seg-btn[data-vp]');
      vpBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          vpBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          wrap.setAttribute('data-vp', btn.getAttribute('data-vp'));
        });
      });
    })();
  </script>
</body>
</html>
