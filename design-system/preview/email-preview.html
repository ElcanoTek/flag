<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email Template Preview — Elcano Design System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1A0B1E;
      color: #D2D9DE;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 14px 24px;
      background: #241B31;
      border-bottom: 1px solid #3a2f4d;
    }

    .preview-toolbar__left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .preview-toolbar__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #9DA7EF;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .preview-toolbar__back:hover {
      background: rgba(157, 167, 239, 0.1);
      border-color: rgba(157, 167, 239, 0.25);
    }

    .preview-toolbar__title {
      font-size: 14px;
      font-weight: 700;
      color: #FAFAFA;
      letter-spacing: 0.01em;
    }

    .preview-toolbar__subtitle {
      font-size: 12px;
      color: #BEB6CD;
      margin-top: 2px;
    }

    .preview-toolbar__right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewport-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #BEB6CD;
      background: transparent;
      border: 1px solid #3a2f4d;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .viewport-btn:hover {
      background: rgba(157, 167, 239, 0.08);
      color: #D2D9DE;
    }

    .viewport-btn.active {
      background: #7272AB;
      color: #FAFAFA;
      border-color: #7272AB;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #BEB6CD;
      background: transparent;
      border: 1px solid #3a2f4d;
      border-radius: 6px;
      text-decoration: none;
      transition: all 0.15s;
    }

    .source-link:hover {
      background: rgba(157, 167, 239, 0.08);
      color: #D2D9DE;
    }

    .preview-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 32px 24px;
      background: #141020;
    }

    .preview-frame-wrap {
      width: 100%;
      max-width: 700px;
      transition: max-width 0.3s ease;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .preview-frame-wrap[data-viewport="mobile"] {
      max-width: 375px;
    }

    .preview-frame-wrap[data-viewport="tablet"] {
      max-width: 768px;
    }

    .preview-frame-wrap[data-viewport="desktop"] {
      max-width: 100%;
    }

    .preview-frame {
      width: 100%;
      height: calc(100vh - 120px);
      border: none;
      background: #F4F6FB;
    }
  </style>
</head>
<body>
  <div class="preview-toolbar">
    <div class="preview-toolbar__left">
      <a class="preview-toolbar__back" href="./index.html">&#8592; Design System</a>
      <div>
        <div class="preview-toolbar__title">Email-Safe Template Preview</div>
        <div class="preview-toolbar__subtitle">Rendered view of design-system/email-safe.html</div>
      </div>
    </div>
    <div class="preview-toolbar__right">
      <button class="viewport-btn" data-width="mobile" title="Mobile 375px">Mobile</button>
      <button class="viewport-btn active" data-width="tablet" title="Tablet / Email 768px">Email</button>
      <button class="viewport-btn" data-width="desktop" title="Full width">Desktop</button>
      <a class="source-link" href="https://github.com/ElcanoTek/flag/blob/main/design-system/email-safe.html" target="_blank" rel="noreferrer">View Source &#8599;</a>
    </div>
  </div>
  <div class="preview-stage">
    <div class="preview-frame-wrap" id="frameWrap" data-viewport="tablet">
      <iframe class="preview-frame" id="emailFrame" src="../email-safe.html" title="Email template rendered preview"></iframe>
    </div>
  </div>

  <script>
    (function () {
      var buttons = document.querySelectorAll('.viewport-btn[data-width]');
      var wrap = document.getElementById('frameWrap');

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          buttons.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          wrap.setAttribute('data-viewport', btn.getAttribute('data-width'));
        });
      });
    })();
  </script>
</body>
</html>
